    <style>
        * {box-sizing:border-box}
        body{
          background-color: #f2f2f2;
        }

/* Slideshow container */
.slideshow-container {
  width: 70%;
  position: relative;
  margin: auto;
}

/* Hide the images by default */
.mySlides {
  display: none;
}

/* Next & previous buttons */
.prev, .next {
  cursor: pointer;
  position: absolute;
  top: 50%;
  width: auto;
  margin-top: -22px;
  padding: 16px;
  color: white;
  font-weight: bold;
  font-size: 18px;
  transition: 0.6s ease;
  border-radius: 0 3px 3px 0;
  user-select: none;
}

/* Position the "next button" to the right */
.next {
  right: 0;
  border-radius: 3px 0 0 3px;
}

/* On hover, add a black background color with a little bit see-through */
.prev:hover, .next:hover {
  background-color: rgba(0,0,0,0.8);
}

/* Caption text */
.text {
  color: white;
  font-size: 15px;
  padding: 8px 12px;
  position: absolute;
  bottom: 8px;
  width: 100%;
  text-align: center;
}

/* Number text (1/3 etc) */
.numbertext {
  color: #f2f2f2;
  font-size: 12px;
  padding: 8px 12px;
  position: absolute;
  top: 0;
}

.box{
  background-color: white;
  color: black;
  border-radius: 10px;
  text-decoration: none;
        font-size: 1.5rem;
        padding: 13px 35px;
        box-sizing: border-box;
        font-weight: 700;
        width: 50%;
        font-family: 'Gill Sans';
       box-shadow:  0 0 5px rgba(0, 0, 0, .2); 
}


#button{
                background-color:magenta;
                border: none;
                color: white;
                padding: 16px 32px;
                text-align: center;
                text-decoration: none;
                display: inline-block;
                font-size: 16px;
                margin: 4px 2px;
                transition-duration: 0.4s;
                cursor: pointer;
                color: white;
                border: 2px solid magenta;
                border-radius: 5px;
                float: right;
            }



/* The dots/bullets/indicators */
.dot {
  cursor: pointer;
  width: 15px;
  margin: 0 2px;
  background-color: #bbb;
  border-radius: 50%;
  display: inline-block;
  transition: background-color 0.6s ease;
}

.active, .dot:hover {
  background-color: #717171;
}

/* Fading animation */
.fade {
  animation-name: fade;
  animation-duration: 1.5s;
}

@keyframes fade {
  from {opacity: .4}
  to {opacity: 1}
}

form{

#search-input{

.gallery{

.gallery img {

  max-width: 350px;
  height: 300px;
  object-fit: cover;
  border-radius: 4px;
}
.gallery::after{
  content: "";
  width: 350px;
}
    </style>

      <script>
        let slideIndex = 0;
    showSlides();
    
    function showSlides() {
      let i;
      let slides = document.getElementsByClassName("mySlides");
      for (i = 0; i < slides.length; i++) {
        slides[i].style.display = "none";
      }
      slideIndex++;
      if (slideIndex > slides.length) {slideIndex = 1}
      slides[slideIndex-1].style.display = "block";
      setTimeout(showSlides, 2000); // Change image every 2 seconds
    }
      </script>
