<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>REEM'S | Shop</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="shop.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header>

<!-- Use the same navbar from index.html -->

</header>

<section class="shop-hero">

<div class="shop-content">

<span>REEM'S COLLECTION</span>

<h1>SHOP</h1>

<p>
Discover premium streetwear built for movement,
comfort and confidence.
</p>

</div>

</section>

<section class="shop-container">

<div class="filters">

    <h3>Filter Products</h3>

    <div class="filter-group">
    
    <h4>Category</h4>
    
    <label><input type="radio" name="category" value="all" checked> All</label>
    
    <label><input type="radio" name="category" value="men"> Men</label>
    
    <label><input type="radio" name="category" value="women"> Women</label>
    
    <label><input type="radio" name="category" value="sportwear"> Sport Wear</label>
    
    <label><input type="radio" name="category" value="accessories"> Accessories</label>
    
    </div>
    
    <div class="filter-group">
    
    <h4>Sort</h4>
    
    <select id="sort">
    
    <option value="default">Default</option>
    
    <option value="low-high">Price: Low to High</option>
    
    <option value="high-low">Price: High to Low</option>
    
    <option value="newest">Newest</option>
    
    </select>
    
    </div>

</div>

<div class="shop-products">

<div id="shop-grid"></div>

</div>

</section>

<footer>

<!-- Same footer from homepage -->

</footer>

<script src="js/data.js"></script>
<script src="js/shop.js"></script>

</body>
</html>
